    <path d="M164 29 L197 29 L252 181 L218 181 L208 152 L152 152 L142 181 L108 181 Z M180 74 L163 124 L197 124 Z M254 58 H350 A28 28 0 0 1 378 86 V185 A28 28 0 0 1 350 213 H254 Z M286 88 V183 H346 V88 Z" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linejoin="round" fill-rule="evenodd"/>
