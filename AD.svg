      <polygon points="392,142 440,158 362,188" fill="#DC6C00"/>
      <polygon points="440,158 406,219 362,188" fill="#EC8208"/>
      <polygon points="213,219 298,188 332,219" fill="#FFEA64"/>
      <polygon points="298,188 362,188 332,219" fill="#FFC830"/>
      <polygon points="362,188 406,219 332,219" fill="#FFA81C"/>
