      <polygon points="325,58 378,58 378,125 346,88 286,88" fill="#E6EBEF"/>
      <polygon points="254,115 286,88 286,160 254,185" fill="#E2E7EC"/>
      <polygon points="346,88 378,125 378,185 346,183" fill="#F8FAFC"/>
      <polygon points="254,185 286,183 346,183 378,213 254,213" fill="#FFFFFF"/>
