    <g clip-path="url(#clip-ad-br)">
      <polygon points="281,101 474,101 406,219 213,219" fill="#F49210"/>
      <polygon points="281,101 358,101 325,146 255,146" fill="#FFAA18"/>
      <polygon points="358,101 428,101 392,142 325,146" fill="#EA7B04"/>
