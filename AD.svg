      <polygon points="96,112 152,118 118,138" fill="#0688CE"/>
      <polygon points="152,118 248,74 213,138 118,138" fill="#0472BA"/>
    </g>
    <polyline points="20,138 88,21 281,21" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linejoin="miter"/>
  </g>

