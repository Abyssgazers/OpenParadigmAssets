<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 494 241">
  <title>AD</title>
  <defs>
    <filter id="glow-ad-tl" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#38DCFF" flood-opacity="0.7"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <filter id="glow-ad-br" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#FF9818" flood-opacity="0.7"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <filter id="shadow-letter" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <clipPath id="clip-ad-tl">
      <polygon points="88,21 281,21 213,138 20,138"/>
    </clipPath>
    <clipPath id="clip-ad-br">
      <polygon points="281,101 474,101 406,219 213,219"/>
    </clipPath>
