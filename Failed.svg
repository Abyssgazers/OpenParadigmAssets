<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 415 217">
  <title>Failed</title>
  <defs>
    <filter id="glow-failed-bg" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="blur-spot" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="shadow-letter" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <clipPath id="clip-failed-bg">
      <path d="M81 38 L275 38 L252 78 L394 78 L327 194 L138 194 L161 154 L19 154 Z"/>
    </clipPath>
    <clipPath id="clip-failed-f">
      <path d="M148 21 H272 V51 H180 V83 H249 V113 H180 V176 H148 Z"/>
    </clipPath>
  </defs>

  <!-- Background Weathered Grey Low-Poly Parallelograms -->
  <g filter="url(#glow-failed-bg)">
    <g clip-path="url(#clip-failed-bg)">
      <rect x="15" y="35" width="385" height="165" fill="#686868"/>
      <polygon points="81,38 152,38 112,88 48,92" fill="#A6A6A6"/>
      <polygon points="152,38 225,38 175,88 112,88" fill="#828282"/>
      <polygon points="225,38 275,38 252,78 175,88" fill="#6E6E6E"/>
      <polygon points="48,92 112,88 92,132 19,154" fill="#8E8E8E"/>
      <polygon points="112,88 175,88 92,132" fill="#5A5A5A"/>
      <polygon points="19,154 92,132 145,154" fill="#484848"/>
      <polygon points="92,132 175,88 228,136 145,154" fill="#626262"/>
      <polygon points="175,88 252,78 286,126 228,136" fill="#787878"/>
      <polygon points="252,78 332,78 286,126" fill="#888888"/>
      <polygon points="332,78 394,78 358,134 286,126" fill="#A2A2A2"/>
      <polygon points="286,126 358,134 306,172 228,136" fill="#5E5E5E"/>
      <polygon points="358,134 394,78 327,194 306,172" fill="#747474"/>
      <polygon points="138,194 228,136 258,194" fill="#424242"/>
      <polygon points="228,136 306,172 258,194" fill="#545454"/>
      <polygon points="258,194 306,172 327,194" fill="#4C4C4C"/>

      <!-- Dark splatter flecks -->
      <g fill="#2E2E2E" opacity="0.45">
        <circle cx="95" cy="62" r="5"/><circle cx="106" cy="54" r="3"/><circle cx="132" cy="116" r="7"/>
        <circle cx="78" cy="128" r="6"/><circle cx="246" cy="108" r="8"/><circle cx="268" cy="118" r="10"/>
        <circle cx="285" cy="96" r="5"/><circle cx="318" cy="112" r="6"/><circle cx="298" cy="172" r="8"/>
        <circle cx="195" cy="168" r="6"/><circle cx="348" cy="126" r="5"/>
      </g>

      <!-- Soft blurred white glow spots matching Failed徽章小图 -->
      <g filter="url(#blur-spot)" fill="#FFFFFF">
        <circle cx="115" cy="72" r="18" opacity="0.8"/>
        <circle cx="52" cy="128" r="22" opacity="0.9"/>
        <circle cx="332" cy="152" r="20" opacity="0.85"/>
        <circle cx="375" cy="94" r="18" opacity="0.85"/>
      </g>
      <polygon points="215,152 228,148 232,160 222,166 212,160" fill="#ECECEC" opacity="0.85"/>
      <polygon points="234,170 248,166 254,178 244,186 232,180" fill="#F2F2F2" opacity="0.88"/>
      <polygon points="208,184 218,180 222,190 212,193" fill="#E4E4E4" opacity="0.8"/>
    </g>
  </g>

  <!-- Foreground White Low-Poly 'F' Letter -->
  <g filter="url(#shadow-letter)">
    <g clip-path="url(#clip-failed-f)">
      <rect x="145" y="18" width="132" height="162" fill="#F2F4F6"/>
      <polygon points="148,21 215,21 180,51 148,51" fill="#FFFFFF"/>
      <polygon points="215,21 272,21 272,51 180,51" fill="#E2E6EA"/>
      <polygon points="148,51 180,51 180,108 148,96" fill="#E6EAEF"/>
      <polygon points="180,83 249,83 249,113 180,113" fill="#FFFFFF"/>
      <polygon points="148,96 180,108 180,176 148,176" fill="#F8FAFC"/>
    </g>
    <path d="M148 21 H272 V51 H180 V83 H249 V113 H180 V176 H148 Z" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linejoin="round"/>
  </g>
</svg>
