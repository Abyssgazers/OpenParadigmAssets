<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 273">
  <title>MINFPLUS</title>
  <defs>
    <filter id="glow-infp" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#2CE8FF" flood-opacity="0.85"/>
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#00C8FF" flood-opacity="0.45"/>
    </filter>
    <pattern id="hatch-white" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#D8E6EE" stroke-width="2.2" stroke-opacity="0.55"/>
    </pattern>
    <pattern id="hatch-cyan" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#B8FCFF" stroke-width="2.2" stroke-opacity="0.45"/>
    </pattern>
    <linearGradient id="ribbon-base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#ECF4F8"/>
      <stop offset="100%" stop-color="#DAE8F0"/>
    </linearGradient>
    <linearGradient id="cyan-slash" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#96FCFF"/>
      <stop offset="55%" stop-color="#48EEFF"/>
      <stop offset="100%" stop-color="#1AD8FA"/>
    </linearGradient>
    <clipPath id="clip-ribbon">
      <path d="M108 35 L145 72 L126 181 L228 181 L250 52 L390 52 L430 93 L405 240 L368 202 L387 93 L285 93 L263 221 L122 221 L81 180 Z"/>
    </clipPath>
    <clipPath id="clip-slash-tl">
      <path d="M123 23 L176 23 L229 77 L221 123 Z"/>
    </clipPath>
    <clipPath id="clip-slash-br">
      <path d="M291 150 L388 248 L335 248 L283 195 Z"/>
    </clipPath>
    <clipPath id="clip-plus">
      <path d="M405 15 H445 V45 H475 V85 H445 V115 H405 V85 H375 V45 H405 Z"/>
    </clipPath>
  </defs>

  <g filter="url(#glow-infp)">
    <!-- Main White Infinity Ribbon -->
    <g clip-path="url(#clip-ribbon)">
      <path d="M108 35 L145 72 L126 181 L228 181 L250 52 L390 52 L430 93 L405 240 L368 202 L387 93 L285 93 L263 221 L122 221 L81 180 Z" fill="url(#ribbon-base)"/>
      <polygon points="108,35 145,72 95,120" fill="#FFFFFF" opacity="0.85"/>
      <polygon points="145,72 126,181 81,180 95,120" fill="#DCE8F0" opacity="0.75"/>
      <polygon points="81,180 126,181 122,221" fill="#C8DAE6" opacity="0.7"/>
      <polygon points="126,181 200,181 165,221 122,221" fill="#F4F9FC" opacity="0.8"/>
      <polygon points="200,181 228,181 263,221 165,221" fill="#D4E3EC" opacity="0.75"/>
      <polygon points="228,181 250,52 285,93 263,221" fill="#E6F0F6" opacity="0.8"/>
      <polygon points="250,52 325,52 285,93" fill="#FFFFFF" opacity="0.9"/>
      <polygon points="325,52 390,52 387,93 285,93" fill="#DCE9F2" opacity="0.75"/>
      <polygon points="387,93 430,93 416,170 376,155" fill="#F2F8FB" opacity="0.85"/>
      <polygon points="376,155 416,170 405,240 368,202" fill="#D6E5EE" opacity="0.75"/>
      <rect x="70" y="20" width="380" height="230" fill="url(#hatch-white)"/>
    </g>
    <path d="M108 35 L145 72 L126 181 L228 181 L250 52 L390 52 L430 93 L405 240 L368 202 L387 93 L285 93 L263 221 L122 221 L81 180 Z" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linejoin="miter"/>

    <!-- Top-Left Cyan Detached Slash -->
    <g clip-path="url(#clip-slash-tl)">
      <path d="M123 23 L176 23 L229 77 L221 123 Z" fill="url(#cyan-slash)"/>
      <polygon points="123,23 176,23 185,68" fill="#B4FDFF" opacity="0.65"/>
      <polygon points="176,23 229,77 185,68" fill="#32E4FC" opacity="0.75"/>
      <polygon points="123,23 185,68 221,123" fill="#6CF4FF" opacity="0.6"/>
      <polygon points="185,68 229,77 221,123" fill="#14CEFA" opacity="0.75"/>
      <rect x="115" y="15" width="125" height="115" fill="url(#hatch-cyan)"/>
    </g>
    <path d="M123 23 L176 23 L229 77 L221 123 Z" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="miter"/>

    <!-- Bottom-Right Cyan Detached Slash -->
    <g clip-path="url(#clip-slash-br)">
      <path d="M291 150 L388 248 L335 248 L283 195 Z" fill="url(#cyan-slash)"/>
      <polygon points="291,150 342,201 283,195" fill="#A8FCFF" opacity="0.7"/>
      <polygon points="283,195 342,201 335,248" fill="#1AD2FA" opacity="0.75"/>
      <polygon points="342,201 388,248 335,248" fill="#64F2FF" opacity="0.7"/>
      <rect x="275" y="145" width="120" height="110" fill="url(#hatch-cyan)"/>
    </g>
    <path d="M291 150 L388 248 L335 248 L283 195 Z" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="miter"/>

    <!-- Top-Right Cyan Plus Sign -->
    <g clip-path="url(#clip-plus)">
      <path d="M405 15 H445 V45 H475 V85 H445 V115 H405 V85 H375 V45 H405 Z" fill="url(#cyan-slash)"/>
      <polygon points="405,15 445,15 425,65 375,45" fill="#A8FCFF" opacity="0.55"/>
      <polygon points="445,15 475,45 475,85 425,65" fill="#2CE2FA" opacity="0.65"/>
      <polygon points="375,45 425,65 405,115 375,85" fill="#64F2FF" opacity="0.55"/>
      <polygon points="425,65 475,85 445,115 405,115" fill="#18CCF6" opacity="0.7"/>
      <rect x="370" y="10" width="110" height="110" fill="url(#hatch-cyan)"/>
    </g>
    <path d="M405 15 H445 V45 H475 V85 H445 V115 H405 V85 H375 V45 H405 Z" fill="none" stroke="#FFFFFF" stroke-width="3.5"/>
    <path d="M409 19 H441 V49 H471 V81 H441 V111 H409 V81 H379 V49 H409 Z" fill="none" stroke="#B8FCFF" stroke-width="1.5" opacity="0.8"/>
  </g>
</svg>
