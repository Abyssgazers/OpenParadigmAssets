<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 494 241">
  <title>FC</title>
  <defs>
    <filter id="glow-fc-bg" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#A8E838" flood-opacity="0.5"/>
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <filter id="shadow-letter" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <clipPath id="clip-fc-tl">
      <polygon points="88,21 281,21 213,138 20,138"/>
    </clipPath>
    <clipPath id="clip-fc-br">
      <polygon points="281,101 474,101 406,219 213,219"/>
    </clipPath>
    <clipPath id="clip-fc-letters">
      <path d="M120 28 H243 V58 H152 V90 H220 V120 H152 V181 H120 Z M282 58 H378 V88 H286 V183 H378 V213 H282 A28 28 0 0 1 254 185 V86 A28 28 0 0 1 282 58 Z"/>
    </clipPath>
  </defs>

  <!-- Background Parallelograms -->
  <g filter="url(#glow-fc-bg)">
    <!-- Top-Left Green-to-Orange Low-Poly Parallelogram -->
    <g clip-path="url(#clip-fc-tl)">
      <polygon points="88,21 281,21 213,138 20,138" fill="#8CD828"/>
      <polygon points="88,21 155,21 102,68" fill="#C4DC3C"/>
      <polygon points="88,21 102,68 48,92" fill="#9AE838"/>
      <polygon points="155,21 225,21 172,66 102,68" fill="#D8AC28"/>
      <polygon points="225,21 281,21 245,78 172,66" fill="#F48E18"/>
      <polygon points="48,92 102,68 96,114 20,138" fill="#68F442"/>
      <polygon points="102,68 172,66 96,114" fill="#96E234"/>
      <polygon points="172,66 245,78 213,138 96,114" fill="#C8B428"/>
      <polygon points="20,138 96,114 128,138" fill="#42E438"/>
      <polygon points="96,114 213,138 128,138" fill="#88E036"/>
    </g>
    <polyline points="20,138 88,21 281,21" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linejoin="miter"/>

    <!-- Bottom-Right Green-to-Orange Low-Poly Parallelogram -->
    <g clip-path="url(#clip-fc-br)">
      <polygon points="281,101 474,101 406,219 213,219" fill="#D8981C"/>
      <polygon points="281,101 358,101 325,146 255,146" fill="#C8AC24"/>
      <polygon points="358,101 428,101 392,142 325,146" fill="#EA8614"/>
      <polygon points="428,101 474,101 440,158 392,142" fill="#FA9A20"/>
      <polygon points="255,146 325,146 298,188 213,219" fill="#88E838"/>
      <polygon points="325,146 392,142 362,188 298,188" fill="#C49E1A"/>
      <polygon points="392,142 440,158 362,188" fill="#DF7C0C"/>
      <polygon points="440,158 406,219 362,188" fill="#EE8E16"/>
      <polygon points="213,219 298,188 332,219" fill="#68F03E"/>
      <polygon points="298,188 362,188 332,219" fill="#B2DC2E"/>
      <polygon points="362,188 406,219 332,219" fill="#D8B828"/>
    </g>
    <polyline points="474,101 406,219 213,219" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linejoin="miter"/>
  </g>

  <!-- Foreground White Low-Poly 'FC' Letters -->
  <g filter="url(#shadow-letter)">
    <g clip-path="url(#clip-fc-letters)">
      <rect x="115" y="25" width="270" height="195" fill="#F4F6F8"/>
      <polygon points="120,28 195,28 152,58 120,58" fill="#FFFFFF"/>
      <polygon points="195,28 243,28 243,58 152,58" fill="#E5EAEE"/>
      <polygon points="120,58 152,58 152,115 120,105" fill="#E8EDF2"/>
      <polygon points="152,90 220,90 220,120 152,120" fill="#FFFFFF"/>
      <polygon points="120,105 152,115 152,181 120,181" fill="#F8FAFC"/>
      <polygon points="254,58 330,58 286,88 254,105" fill="#FFFFFF"/>
      <polygon points="330,58 378,58 378,88 286,88" fill="#E6EBEF"/>
      <polygon points="254,105 286,88 286,165 254,180" fill="#E2E7EC"/>
      <polygon points="254,180 286,165 335,183 310,213 254,213" fill="#FFFFFF"/>
      <polygon points="335,183 378,183 378,213 310,213" fill="#EAEFF3"/>
    </g>
    <path d="M120 28 H243 V58 H152 V90 H220 V120 H152 V181 H120 Z M282 58 H378 V88 H286 V183 H378 V213 H282 A28 28 0 0 1 254 185 V86 A28 28 0 0 1 282 58 Z" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linejoin="round"/>
  </g>
</svg>
