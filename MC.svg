      <polygon points="190,33 275,33 240,71 153,71" fill="#FFFFFF" opacity="0.9"/>
      <polygon points="275,33 345,33 338,71 240,71" fill="#E5DFD7" opacity="0.8"/>
      <polygon points="149,88 192,88 180,155 136,155" fill="#E4DDD4" opacity="0.8"/>
      <polygon points="136,155 180,155 172,202 122,240" fill="#F6F3EE" opacity="0.88"/>
      <polygon points="172,202 255,202 230,240 122,240" fill="#FFFFFF" opacity="0.88"/>
      <polygon points="255,202 325,202 318,240 230,240" fill="#DED7CE" opacity="0.8"/>
      <rect x="115" y="30" width="240" height="215" fill="url(#hatch-taupe)"/>
    </g>
    <path d="M190 33 L345 33 L338 71 L153 71 Z M149 88 L192 88 L172 202 L325 202 L318 240 L122 240 Z" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linejoin="miter"/>
