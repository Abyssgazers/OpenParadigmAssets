<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 273">
  <title>MC</title>
  <defs>
    <filter id="glow-c" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#B8A48C" flood-opacity="0.75"/>
      <feDropShadow dx="0" dy="0" stdDeviation="13" flood-color="#988268" flood-opacity="0.35"/>
    </filter>
    <pattern id="hatch-taupe" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#DDD6CE" stroke-width="2.2" stroke-opacity="0.55"/>
    </pattern>
    <linearGradient id="white-taupe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#F4F0EA"/>
      <stop offset="100%" stop-color="#E4DED6"/>
    </linearGradient>
    <clipPath id="clip-mc">
      <path d="M190 33 L345 33 L338 71 L153 71 Z M149 88 L192 88 L172 202 L325 202 L318 240 L122 240 Z"/>
    </clipPath>
  </defs>

  <g filter="url(#glow-c)">
